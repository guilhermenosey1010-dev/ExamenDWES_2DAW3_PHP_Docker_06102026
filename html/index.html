<html>
    <head>
        <title>Examen de Desarrollo web en entorno servidor</title>
        <link rel="stylesheet" type="text/css" href="../estilos/estilos.css">
        <link rel="icon" type="image/png" sizes="32x32" href="../imagenes/favicon.jpeg">
    </head>
    <body>
        <h1>Centro de Ayuda al Empleo</h1>
        <h2>Formulario de solicitud</h2>
        <button onclick="location.href='../php/tabla.php?tipo=soldadura'">Soldadura</button>
        <button onclick="location.href='../php/tabla.php?tipo=informatica'">Informatica</button>
        <button onclick="location.href='../php/tabla.php?tipo=asistencia%20sociosanitaria'">Asistencia Sociosanitaria</button>
        <form action="../php/tabla.php" method="POST">
    Nombre: <input type="text" name="nombre" required><br>
    Apellidos: <input type="text" name="apellidos" required><br>
    DNI: <input type="text" name="dni" required><br>
    Fecha de nacimiento: <input type="date" name="f_nac" required><br>
    Telefono: <input type="tel" name="tlf" required><br>
    Email: <input type="email" name="email" required><br>

    Profesion:
    <select name="tipo" required>
        <option value="soldadura">Soldadura</option>
        <option value="informatica">Informatica</option>
        <option value="asistencia sociosanitaria">Asistencia sociosanitaria</option>
    </select><br>

    Jornada:
    <label>
        <input type="radio" name="jornadaParcial" value="1" required>
        Parcial
    </label>
    <label>
        <input type="radio" name="jornadaParcial" value="0">
        Completa
    </label><br>

    Idiomas:
    <label>
        <input type="checkbox" name="idiomas[]" value="Euskera">
        Euskera
    </label>
    <label>
        <input type="checkbox" name="idiomas[]" value="Español">
        Espaniol
    </label><br>

    <input type="submit" value="Enviar">
</form>
    </body>
</html>
